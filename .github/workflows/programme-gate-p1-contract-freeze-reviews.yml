name: Run protected P1 contract-freeze reviews

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit to review
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: programme-gate-p1-contract-freeze-reviews
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, canonical-review]
    environment: programme-gate-production
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clean main commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "${GITHUB_SHA}" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_COMMIT}"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without protected credentials
        run: npm ci
      - name: Run protected P1 reviews
        env:
          EXPECTED_PROGRAMME_COMMIT: ${{ inputs.expected_commit }}
          P1_REVIEW_EPOCH_NONCE: p1-review-${{ github.run_id }}-${{ github.run_attempt }}
          LOCAL_CODEX_AUTH_FILE: /Users/bengoodchild/.codex/auth.json
          PROGRAMME_GATE_REVIEW_CONTROLLER_ED25519_PRIVATE_KEY_PEM: ${{ secrets.PROGRAMME_GATE_REVIEW_CONTROLLER_ED25519_PRIVATE_KEY_PEM }}
          PROGRAMME_REVIEW_OUTPUT: ${{ runner.temp }}/programme-gate-p1-contract-freeze-reviews.json
        run: |
          set -euo pipefail
          umask 077
          node scripts/run-p1-protected-contract-freeze-reviews.mjs
          test -s "${PROGRAMME_REVIEW_OUTPUT}"
      - name: Upload signed P1 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: programme-gate-p1-contract-freeze-reviews-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/programme-gate-p1-contract-freeze-reviews.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove runner output
        if: always()
        run: rm -f "${RUNNER_TEMP}/programme-gate-p1-contract-freeze-reviews.json"
