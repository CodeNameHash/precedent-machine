name: Product CI

on:
  pull_request:
  push:
    # The product branch and its parallel-session branch run the same
    # workflow on every push (work package D2, plan finding (141)): the
    # database job had not run since 2026-09-05 on pull requests alone.
    branches: [main, codex/product-implementation-plan-20260904, claude/festive-albattani-70cwn5]

concurrency:
  group: product-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Active product behaviour
        run: npm run test:active
      - name: Authentication behaviour
        run: npm run test:auth
      - name: Database migration and rollback
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test --test-concurrency=1 tests/product-phase-1-db.test.js tests/product-phase-2-db.test.js tests/product-phase-3-db.test.js tests/product-failed-model-call-durability.test.js tests/product-provider-response-durability-db.test.js tests/product-monotonic-failure-db.test.js tests/product-analysis-running-progress-db.test.js tests/product-review-timing-integration-db.test.js tests/product-finding-resolution-db.test.js tests/product-relationship-review-db.test.js tests/product-span-closure-lookup-db.test.js tests/product-cross-section-relationship-db.test.js tests/product-legal-schema-revision-persistence-db.test.js tests/product-fact-occurrence-collision-db.test.js tests/product-termination-effect-db.test.js tests/product-review-validation-identity-lookup-db.test.js tests/product-sandbox-pool-db.test.js tests/product-phase-6-db.test.js tests/product-move-to-production.test.js
      - name: Tracked secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Production build
        run: npm run build
