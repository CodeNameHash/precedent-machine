name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  plan-heavy-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.plan.outputs.run_heavy }}
    steps:
      - name: Find a byte-identical mergeable PR for this exact codex push
        id: open-pr
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
        continue-on-error: true
        env:
          EXPECTED_HEAD_REF: ${{ github.ref_name }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a lowercase GitHub SHA-1."
            exit 1
          fi
          response="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100")"
          printf '%s\n' "${response}" | jq -e \
            'type == "array" and all(.[]; (.number | type) == "number" and .number > 0 and (.number | floor) == .number and (.state | type) == "string" and (.head | type) == "object" and (.head.sha | type) == "string" and (.head.ref | type) == "string" and (.head.repo | type) == "object" and (.head.repo.full_name | type) == "string")' \
            >/dev/null
          exact_pr_numbers="$(printf '%s\n' "${response}" | jq -r \
            --arg ref "${EXPECTED_HEAD_REF}" \
            --arg repo "${EXPECTED_HEAD_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            '.[] | select(.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo and .head.ref == $ref) | .number')"
          pr_owner_ready=false
          head_tree_sha=""
          while IFS= read -r pr_number; do
            [ -n "${pr_number}" ] || continue
            candidate="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            candidate_ready="$(printf '%s\n' "${candidate}" | jq -r \
              --arg ref "${EXPECTED_HEAD_REF}" \
              --arg repo "${EXPECTED_HEAD_REPOSITORY}" \
              --arg sha "${GITHUB_SHA}" \
              --argjson number "${pr_number}" \
              'type == "object" and .number == $number and .state == "open" and .head.sha == $sha and .head.repo.full_name == $repo and .head.ref == $ref and has("mergeable") and .mergeable == true and has("merge_commit_sha") and (.merge_commit_sha | type) == "string" and (.merge_commit_sha | test("^[0-9a-f]{40}$"))')"
            case "${candidate_ready}" in
              true)
                if [ -z "${head_tree_sha}" ]; then
                  head_commit="$(gh api \
                    -H 'Accept: application/vnd.github+json' \
                    "/repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}")"
                  head_tree_sha="$(printf '%s\n' "${head_commit}" | jq -er \
                    --arg expected "${GITHUB_SHA}" \
                    'select(type == "object" and .sha == $expected and (.tree | type) == "object" and (.tree.sha | type) == "string" and (.tree.sha | test("^[0-9a-f]{40}$"))) | .tree.sha')"
                  if [[ ! "${head_tree_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "Head tree SHA is not a lowercase GitHub SHA-1."
                    exit 1
                  fi
                fi
                merge_commit_sha="$(printf '%s\n' "${candidate}" | jq -er '.merge_commit_sha')"
                if [[ ! "${merge_commit_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "Merge commit SHA is not a lowercase GitHub SHA-1."
                  exit 1
                fi
                merge_commit="$(gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "/repos/${GITHUB_REPOSITORY}/git/commits/${merge_commit_sha}")"
                merge_tree_sha="$(printf '%s\n' "${merge_commit}" | jq -er \
                  --arg expected "${merge_commit_sha}" \
                  'select(type == "object" and .sha == $expected and (.tree | type) == "object" and (.tree.sha | type) == "string" and (.tree.sha | test("^[0-9a-f]{40}$"))) | .tree.sha')"
                if [[ ! "${merge_tree_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "Merge tree SHA is not a lowercase GitHub SHA-1."
                  exit 1
                fi
                if [ "${merge_tree_sha}" = "${head_tree_sha}" ]; then
                  pr_owner_ready=true
                  break
                fi
                ;;
              false) ;;
              *) exit 1 ;;
            esac
          done <<< "${exact_pr_numbers}"
          echo "pr_owner_ready=${pr_owner_ready}" >> "${GITHUB_OUTPUT}"
      - name: Plan heavy CI
        id: plan
        if: always()
        env:
          IS_CODEX_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') }}
          QUERY_OUTCOME: ${{ steps.open-pr.outcome }}
          PR_OWNER_READY: ${{ steps.open-pr.outputs.pr_owner_ready }}
        run: |
          run_heavy=true
          reason=full-ci-event
          if [ "${IS_CODEX_PUSH}" = "true" ]; then
            reason=no-exact-open-pr-head
            if [ "${QUERY_OUTCOME}" = "success" ] && [ "${PR_OWNER_READY}" = "true" ]; then
              run_heavy=false
              reason=byte-identical-mergeable-pr-head
            elif [ "${QUERY_OUTCOME}" != "success" ]; then
              reason=pr-query-error-fail-closed
            elif [ "${PR_OWNER_READY}" != "false" ]; then
              reason=pr-query-missing-data-fail-closed
            fi
          fi
          echo "run_heavy=${run_heavy}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "HEAVY-CI-PLAN: run_heavy=${run_heavy} ${reason}"
  test-and-build:
    needs: plan-heavy-ci
    if: ${{ always() && needs.plan-heavy-ci.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        # TAP output for ~5k tests scrolls the failing lines out of the
        # retained log window; re-print every failure at the END of the
        # step so a red run always names its failing tests where the log
        # survives. Exit status is the test run's own, not grep's.
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.log || status=$?
          echo "──── failing tests (if any) ────"
          grep -A 25 "^not ok" /tmp/test-output.log || true
          exit "${status:-0}"
      - name: Production build
        run: npm run build
  invariants:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Invariant 1 (already covered by test-and-build)
        run: echo "covered"
      - name: Invariant 2 — ioc-scope-mismatch
        run: node scripts/audit/ioc-scope-mismatch.js
      - name: Invariant 3 — closing-condition-scope
        run: node scripts/lint/closing-condition-scope.js
      - name: Invariant 4 — forbidden-patterns
        run: bash scripts/lint/forbidden-patterns.sh
      - name: Detect baseline manifest input changes
        id: baseline-impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/baseline-manifest-impact.js
      - name: Baseline manifest is current
        if: steps.baseline-impact.outputs.run == 'true'
        # Re-derives what every committed extraction run WOULD publish if
        # imported, and diffs it against evidence/canonical-v2/baseline-
        # manifest.json. Catches the failure no other gate can see: a change
        # to the runner, resolver, validators, writer or bridge that silently
        # drops rows. An import that publishes less still reports success, so
        # only a recorded yardstick notices.
        #
        # Roughly 30-45 minutes on the current runner. It sits in this job
        # rather than in npm test
        # because it is the same kind of check as the invariants around it --
        # and because a gate that only OPERATING-RULES enforces is a gate that
        # gets skipped.
        run: npm run gate:baseline
      - name: Invariant 5 — market-registry-completeness
        run: node scripts/lint/market-registry-completeness.js
      - name: Invariant 6 — component-reuse
        run: node scripts/lint/component-reuse.js
      - name: Invariant 7 — party-scope-audit
        run: node scripts/lint/party-scope-audit.js
      - name: Invariant 8 — detect-duplicates
        run: node scripts/registry/detect-duplicates.js
      - name: Invariant 9 — orphan-detector
        run: node scripts/registry/orphan-detector.js
      - name: Invariant 10 — coverage-detector
        run: node scripts/registry/coverage-detector.js
      - name: Invariant 11 — provenance-log
        run: node scripts/registry/provenance-log.js
  schema-parity:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect schema parity touch
        id: touch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          if printf '%s\n' "${FILES}" | grep -Eq '^(lib/schema/|lib/rubric\.js|lib/vocab/|components/review/|pages/review/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Schema parity relevant files changed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No schema parity relevant files changed; skipping audit."
          fi
      - name: Detect schema parity env
        id: parity-env
        run: |
          set -euo pipefail
          url="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          key="${SUPABASE_SERVICE_ROLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          if [ -n "${url}" ] && [ -n "${key}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Supabase env vars available for schema parity."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase env vars unavailable; skipping schema parity audit."
          fi
      - name: Schema parity audit
        if: steps.touch.outputs.run == 'true' && steps.parity-env.outputs.available == 'true'
        run: node scripts/audit/schema-parity.js
  demo-set:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect demo-set touch
        id: touch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          if printf '%s\n' "${FILES}" | grep -Eq '^(lib/query/|scripts/query-demo-check\.js)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Query-engine/demo-set relevant files changed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No query-engine/demo-set relevant files changed; skipping."
          fi
      - name: Detect demo-set env
        id: demo-env
        run: |
          set -euo pipefail
          url="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          key="${SUPABASE_SERVICE_ROLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          if [ -n "${url}" ] && [ -n "${key}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Supabase env vars available for demo-set check."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase env vars unavailable; skipping demo-set check."
          fi
      - name: Demo-set check (20/20 live)
        if: steps.touch.outputs.run == 'true' && steps.demo-env.outputs.available == 'true'
        run: node scripts/query-demo-check.js
  demo-dryrun:
    # WP-7 (M5-06). Ben decision B-env: this writes to the production
    # Supabase project (staging-tagged, serialized, torn down — but still
    # prod). NON-REQUIRED until Ben confirms prod-with-staging-tag or funds a
    # dedicated CI Supabase project — continue-on-error keeps this visible on
    # the PR without blocking merge.
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 15
    concurrency:
      group: demo-dryrun
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect demo-dryrun touch
        id: touch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          if printf '%s\n' "${FILES}" | grep -Eq '^(lib/query/|lib/parser-v2/|lib/queries/|pages/api/|scripts/ingest|components/review-v2/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Demo-dryrun relevant files changed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No demo-dryrun relevant files changed; skipping."
          fi
      - name: Detect demo-dryrun env
        id: dryrun-env
        run: |
          set -euo pipefail
          url="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          key="${SUPABASE_SERVICE_ROLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          if [ -n "${url}" ] && [ -n "${key}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Supabase env vars available for demo-dryrun."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase env vars unavailable (fork PR); skipping demo-dryrun."
          fi
      - name: Detect codex CLI availability
        id: codex-cli
        if: steps.touch.outputs.run == 'true' && steps.dryrun-env.outputs.available == 'true'
        run: |
          if command -v codex >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "codex CLI not installed on this runner; skipping demo-dryrun (see scripts/demo-dryrun.js header)."
          fi
      - name: Demo dry-run (ingest → QA → review → query → teardown)
        if: steps.touch.outputs.run == 'true' && steps.dryrun-env.outputs.available == 'true' && steps.codex-cli.outputs.available == 'true'
        run: node scripts/demo-dryrun.js
  phase-allowlist:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files_file="${RUNNER_TEMP}/phase-allowlist-changed-files.txt"
          : > "${changed_files_file}"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || \
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "Full local base/head history is unavailable."
            exit 1
          fi
          MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}" || true)"
          if [ -z "${MERGE_BASE}" ]; then
            echo "No local merge base is available."
            exit 1
          fi
          if ! git diff --no-renames --name-only "${MERGE_BASE}" "${HEAD_SHA}" -- \
            > "${changed_files_file}"; then
            echo "Unable to compute the complete local changed-file set."
            exit 1
          fi
          if [ ! -s "${changed_files_file}" ]; then
            echo "No changed-file names were available."
            exit 1
          fi
          changed_files_bytes="$(wc -c < "${changed_files_file}" | tr -d '[:space:]')"
          if [ "${changed_files_bytes}" -gt 8388608 ]; then
            echo "Changed-file set exceeds 8388608 bytes."
            exit 1
          fi
          echo "CHANGED_FILES_FILE=${changed_files_file}" >> "${GITHUB_ENV}"
          echo "Collected $(grep -c . "${changed_files_file}" || true) changed file(s)"
      - name: Detect active phase from branch name
        run: |
          if [ "${GITHUB_HEAD_REF}" = "infra/ci-allowlist-shallow-checkout" ]; then
            echo "WP-CI-INFRA-01" > .phase-id
            echo "ACTIVE_PHASE=WP-CI-INFRA-01" >> "$GITHUB_ENV"
            echo "WP-CI-INFRA-01"
          else
            node scripts/ci/detect-phase.js
          fi
      - name: Diff-vs-allowlist
        run: |
          if [ "${ACTIVE_PHASE}" = "WP-CI-INFRA-01" ]; then
            outside="$(
              grep -vE '^(\.github/workflows/ci\.yml|scripts/ci/check-allowlist\.js|HANDOFF\.md|BLOCKED-WP-CI-INFRA-01\.md)$' \
                "${CHANGED_FILES_FILE}" || true
            )"
            if [ -n "$outside" ]; then
              echo "Files outside allowlist for WP-CI-INFRA-01:"
              echo "$outside"
              exit 1
            fi
            echo "PHASE-ALLOWLIST: PASS phase WP-CI-INFRA-01"
          else
            node scripts/ci/check-allowlist.js
          fi
