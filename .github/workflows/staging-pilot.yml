name: Isolated staging pilots

on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Which pilot to run
        required: true
        type: choice
        options:
          - metsera
          - qxo
          - both
  push:
    branches:
      - 'run/staging-pilot-metsera'
      - 'run/staging-pilot-qxo'
      - 'run/staging-pilot-both'

permissions:
  contents: read

concurrency:
  group: staging-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PILOT: ${{ inputs.pilot || (github.ref == 'refs/heads/run/staging-pilot-qxo' && 'qxo') || (github.ref == 'refs/heads/run/staging-pilot-both' && 'both') || 'metsera' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Fetch sealed Metsera sources
        if: env.PILOT != 'qxo'
        run: node scripts/fetch-metsera-sealed-sources.mjs --out-dir /tmp/metsera-sources
      - name: Prepare Metsera pilot inputs
        if: env.PILOT != 'qxo'
        run: node scripts/canonical-v2-prepare-metsera-pilot-inputs.mjs --source-dir /tmp/metsera-sources --out-dir /tmp/metsera-pilot-inputs
      - name: Run Metsera staging pilot (rollback-only)
        if: env.PILOT != 'qxo'
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "::error::The STAGING_DB_URL repository secret is missing or empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          # GitHub runners have no IPv6; the direct db.<ref> host is IPv6-only.
          # Rewrite to the IPv4 session pooler, preserving the credential.
          case "$STAGING_DB_URL" in
            *db.sjumbznveyyiizhwvixj.supabase.co*)
              STAGING_DB_URL=$(printf '%s' "$STAGING_DB_URL" \
                | sed -e 's#postgresql://postgres:#postgresql://postgres.sjumbznveyyiizhwvixj:#' \
                      -e 's#db\.sjumbznveyyiizhwvixj\.supabase\.co#aws-0-us-west-2.pooler.supabase.com#')
              echo "Rewrote staging db url to the IPv4 session pooler."
              ;;
          esac
          node scripts/canonical-v2-staging-metsera-exclusivity-p8.mjs \
            --materialisation-input /tmp/metsera-pilot-inputs/materialisation-input.json \
            --materialisation-receipt /tmp/metsera-pilot-inputs/materialisation-receipt.json \
            --cohort-request /tmp/metsera-pilot-inputs/cohort-request.json \
            --cohort-execution-input /tmp/metsera-pilot-inputs/cohort-execution-input.json \
            --db-url "$STAGING_DB_URL"
      - name: Run QXO staging pilot (rollback-only)
        if: env.PILOT != 'metsera'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref sjumbznveyyiizhwvixj --workdir .
          node scripts/canonical-v2-staging-qxo-capitalisation-f28.mjs --verify
