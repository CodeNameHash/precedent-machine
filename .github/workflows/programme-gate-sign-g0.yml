name: Sign G0 evidence

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact deployed main commit to validate and sign
        required: true
        type: string
      deployment_id:
        description: Exact production Vercel deployment ID
        required: true
        type: string
      preview_deployment_id:
        description: Exact canonical branch Preview Vercel deployment ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: programme-gate-sign-g0
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: programme-gate-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 1
      - name: Verify exact main commit
        env:
          EXPECTED_PROGRAMME_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${EXPECTED_PROGRAMME_COMMIT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_PROGRAMME_COMMIT}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect, validate and sign G0 evidence
        env:
          EXPECTED_PROGRAMME_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EXPECTED_VERCEL_PREVIEW_DEPLOYMENT_ID: ${{ inputs.preview_deployment_id }}
          PROGRAMME_GATE_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.PROGRAMME_GATE_STAGING_SUPABASE_SECRET_KEY }}
          PROGRAMME_GATE_VALIDATOR_ED25519_PRIVATE_KEY_PEM: ${{ secrets.PROGRAMME_GATE_VALIDATOR_ED25519_PRIVATE_KEY_PEM }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/sign-g0-evidence.mjs > "${RUNNER_TEMP}/programme-gate-g0-evidence.json"
          test -s "${RUNNER_TEMP}/programme-gate-g0-evidence.json"
      - name: Upload signed evidence
        uses: actions/upload-artifact@v4
        with:
          name: programme-gate-g0-evidence-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/programme-gate-g0-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove runner output
        if: always()
        run: rm -f "${RUNNER_TEMP}/programme-gate-g0-evidence.json"
