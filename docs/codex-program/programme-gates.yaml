          - RELEASE_ACTIVATION
          - PRODUCT_FEATURE_ACTIVATION
      terminal_condition:
        event: FIRST_VALID_PROGRAMME_GATE_STATUS_ARTEFACT_V2_PUBLICATION
        required_generation: 1
        required_predecessor: NONE
        required_work_class_state: canonical_work_start
        required_work_class_result: PASS
        work_class_evaluation_source: PROPOSED_STATUS_RECOMPUTED_FROM_VALIDATED_G0_EVIDENCE
        consume_nonce: true
        expires_immediately: true
        reissue_without_new_registry_amendment: PROHIBITED
    emergency_containment:
      all_of: []
    implementation_planning:
      all_of:
        - G0_EXACT_DIGEST_REVIEW_SET
        - G0_BEN_SPEC_APPROVAL
    isolation_boundary_setup:
      all_of:
        - G0_ZAYO_DISPOSITION
        - G0_CLAUDE_CREDENTIAL_ROTATION
        - G0_SUPABASE_SECRET_DISPOSITION
    snapshot_restore_and_preview:
      all_of:
        - isolation_boundary_setup
        - G0_STAGING_SUPABASE_ISOLATED
        - G0_STAGING_VERCEL_ISOLATED
        - G0_STAGING_ACCESS_PROTECTED
    canonical_work_start:
      all_of:
        - snapshot_restore_and_preview
        - G0_MARKET_STATS_CONTAINED
        - G0_BROAD_CORPUS_ROUTES_CONTAINED
        - G0_EXACT_DIGEST_REVIEW_SET
        - G0_BEN_SPEC_APPROVAL
    vertical_slice_execution:
      all_of:
        - canonical_work_start
        - P1_CONTRACT_FREEZE_ATTESTED
    candidate_scope_and_extraction:
      all_of:
        - vertical_slice_execution
        - P1_VERTICAL_SLICE_PASS
    production_import:
      all_of:
        - candidate_scope_and_extraction
        - P9_SCOPE_EXACT
        - P9_REGISTRY_DISPOSITIONS
        - P9_MKT_WORK
        - P9_BEN_RUNBOOK
        - P9_NUMERIC
        - P9_RENDER_PARITY
        - P9_STRUCTURED_CLAIMS
        - P9_PARTY_LINT
        - P9_SECURITY_AUTH
        - P9_SHADOW_REEXTRACTION
        - P9_IDENTITY_AND_DRIFT
        - P9_BROWSER_A11Y_PERFORMANCE
        - P9_STAGING_SMOKE_AND_ROLLBACK
        - P9_DATABASE_SOAK
        - P9_BACKUP_RESTORE
        - P9_PREIMPORT_TRACEABILITY
        - P9_DEPLOYMENT_PARITY
    cutover_authorisation_issue:
      all_of:
        - production_import
        - P9_IMPORT_PARITY
        - P9_PROMOTION_ELIGIBILITY
    production_cutover:
      all_of:
        - cutover_authorisation_issue
