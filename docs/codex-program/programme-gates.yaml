programme_gate_registry:
  schema: canonical-programme-gates/v2
  yaml_parser_binding:
    yaml_version: "1.2"
    package: yaml
    package_version: "2.9.0"
    options: [STRICT, UNIQUE_KEYS, NO_ALIASES]
  status_source: docs/codex-program/EXECUTION-LEDGER.md
  status_format: HUMAN_READABLE_MARKDOWN_TABLE
  signed_status_required_before_preproduction_work: false
  default_state: OPEN
  allowed_states: [OPEN, PASS, FAIL, BLOCKED, DEFERRED_POST_CUTOVER]

  review_model:
    exact_milestones:
      - id: M1_CONTRACT_FREEZE
        purpose: CONTRACT_BUNDLE_READY_FOR_BEN_APPROVAL
      - id: M2_VERTICAL_SLICE
        purpose: QXO_AND_METSERA_VERTICAL_SLICES_PASS
      - id: M3_FULL_CORPUS_CERTIFICATION
        purpose: PHASE_9_QUALITY_WORK_COMPLETE
      - id: M4_PRE_CUTOVER
        purpose: PRODUCTION_IMPORT_AND_ACTIVATION_READY
    reviewer: FABLE_OR_EQUIVALENT_HIGH_REASONING_REVIEWER
    review_scope: DIFF_SINCE_PRIOR_REVIEWED_STATE
    reviewer_inputs: [DIFF, RELEVANT_CONTRACTS]
    prior_conclusions_supplied: false
    acknowledgement_directory: docs/acks
    acknowledgement_required_fields:
      - reviewed_commit_range
      - date
      - reviewer
      - findings
      - dispositions
      - result
    acknowledgement_result_values: [PASS, FAIL]
    failed_review_action: BOUNDED_FIX_LIST_AND_FIX_DIFF_REVIEW_ONLY
    additional_milestones_permitted: false
    legal_semantic_diff_review:
      remains_required_at_merge: true
      milestone_event: false

  ben_approval_points:
    - MATERIAL_CONTRACT_BUNDLE_FREEZE
    - MATERIAL_TAXONOMY_OR_CODEBOOK_CHANGE
    - PRODUCTION_IMPORT_WHERE_REQUIRED_BY_IMPORT_CONTRACT
    - ONE_USE_PRODUCTION_CUTOVER
  routine_branch_integration_deployment_or_ledger_work_requires_ben: false

  merge_gates:
    required_for_every_merge:
      - npm_test
      - npm_run_build
      - main_remains_deployable
    extraction_change:
      - node_scripts_eval_js
      - legal_semantic_diff_review
    registry_change:
      - registry_drift_tests
    ingestion_change:
      - ingest_qa_gates
    evidence_change:
      - quote_verification_zero_flags
    contract_freeze:
      - two_uncached_compiles_byte_identical
      - zero_missing_members
      - zero_duplicate_identities
      - zero_conflicts
      - zero_dependency_cycles
      - zero_unresolved_dependencies
      - M1_ack_pass
      - ben_exact_bundle_approval

  tier_a_pre_cutover:
    state: ACTIVE
    controls:
      - NO_EXTRACTION_REPLAY_BACKFILL_OR_LOAD_TEST_AGAINST_PRODUCTION
      - BEN_RUN_LOCAL_DRY_RUN_FIRST_CORPUS_WRITES_ONLY
      - STAGING_ONLY_CREDENTIALS_IN_STAGING_AND_PREVIEW
      - NO_PRODUCTION_CREDENTIAL_IN_PREVIEW
      - NO_SERVICE_CREDENTIAL_IN_BROWSER_CODE
      - VERCEL_DEPLOYMENT_PROTECTION_OR_SSO_ON_PREVIEWS
      - NO_SECRETS_IN_EVIDENCE_PROMPTS_OR_COMMITTED_FILES
      - EXISTING_LIVE_ROUTE_GUARD_TESTS_REMAIN_ACTIVE

  work_classes:
    implementation_planning:
      state: PASS
      authority: CONTINUOUS_BOUNDED_BRANCH_WORK
    isolation_boundary_setup:
      state: PASS
      authority: TIER_A_ONLY
    snapshot_restore_and_preview:
      state: PASS
      authority: ISOLATED_STAGING_ONLY
    canonical_work_start:
      state: PASS
      authority: CONTINUOUS_BOUNDED_BRANCH_WORK
    vertical_slice_execution:
      state: OPEN
      opens_when: M1_CONTRACT_FREEZE_PASS_AND_BEN_BUNDLE_APPROVAL
    candidate_scope_and_extraction:
      state: OPEN
      opens_when: M2_VERTICAL_SLICE_PASS
    production_import:
      state: OPEN
      opens_when: ALL_PREIMPORT_GATES_PASS
    production_cutover:
      state: OPEN
      opens_when: M4_PRE_CUTOVER_PASS_AND_ONE_USE_BEN_AUTHORISATION
    security_hardening:
      state: DEFERRED_POST_CUTOVER
      phase: 12

  preproduction_gates:
    - id: P1_CONTRACT_BUNDLE_COMPLETE
      state: OPEN
      acceptance:
        - TWO_UNCACHED_COMPILES_BYTE_IDENTICAL
        - STRUCTURAL_BUNDLE_VALIDATION_PASS
        - M1_ACK_PASS
        - BEN_EXACT_BUNDLE_APPROVAL
    - id: P1_VERTICAL_SLICE_PASS
      state: OPEN
      acceptance:
        - QXO_AGREEMENT_CONTROL_SLICE_PASS
        - METSERA_PROCESS_SLICE_PASS
        - M2_ACK_PASS
    - id: P9_SCOPE_EXACT
      state: OPEN
    - id: P9_REGISTRY_DISPOSITIONS
      state: OPEN
    - id: P9_MKT_WORK
      state: OPEN
    - id: P9_BEN_RUNBOOK
      state: OPEN
    - id: P9_NUMERIC
      state: OPEN
    - id: P9_RENDER_PARITY
      state: OPEN
    - id: P9_STRUCTURED_CLAIMS
      state: OPEN
    - id: P9_PARTY_LINT
      state: OPEN
    - id: P9_SHADOW_REEXTRACTION
      state: OPEN
    - id: P9_IDENTITY_AND_DRIFT
      state: OPEN
    - id: P9_BROWSER_A11Y_PERFORMANCE
      state: OPEN
    - id: P9_STAGING_SMOKE_AND_ROLLBACK
      state: OPEN
    - id: P9_DATABASE_SOAK
      state: OPEN
    - id: P9_BACKUP_RESTORE
      state: OPEN
    - id: P9_PREIMPORT_TRACEABILITY
      state: OPEN
    - id: P9_DEPLOYMENT_PARITY
      state: OPEN
      acceptance:
        - production_release_statistics_root_equal
        - live_physical_plan_fingerprint_root_equal
        - live_query_plan_smoke_equal
        - activation_parity_recheck_fresh_and_current
      governing_test: DEPLOYMENT-PARITY-FRESHNESS-01
      required_adversarial_tests: [POST-ACTIVATION-CONTROLLER-01, DEPLOY-CUTOVER-01]
    - id: P9_IMPORT_PARITY
      state: OPEN
    - id: P9_PROMOTION_ELIGIBILITY
      state: OPEN
    - id: P9_CUTOVER_AUTHORISATION
      state: OPEN
    - id: P9_POSTCUTOVER_SMOKE
      state: OPEN
    - id: P9_TRACEABILITY
      state: OPEN

  production_import_and_cutover:
    strictness: UNCHANGED
    required_controls:
      - EXACT_BUNDLE_DIGEST_VERIFICATION
      - COMPLETE_MEMBER_PARITY
      - CHECKPOINTED_RESUMABLE_IMPORT
      - IMPORT_CHECKPOINT_REPLAY_NO_OP
      - CONFLICTING_REPLAY_FAILS_CLOSED
      - ATOMIC_WHOLE_TUPLE_ACTIVATION
      - POST_CUTOVER_SMOKE_WITH_ROLLBACK
      - ONE_USE_BEN_CUTOVER_AUTHORISATION

  phase_12_security_gates:
    phase: 12
    state: DEFERRED_POST_CUTOVER
    blocks_cutover: false
    gates:
      - id: P9_SECURITY_AUTH
        state: DEFERRED_POST_CUTOVER
      - id: P10_SECURITY_01
        state: DEFERRED_POST_CUTOVER
      - id: ROUTE_ACTION_THREE_WAY_INVENTORY
        state: DEFERRED_POST_CUTOVER
      - id: DEFAULT_DENY_FULL_PROBE_SUITE
        state: DEFERRED_POST_CUTOVER
      - id: EGRESS_DENY_BY_DEFAULT_CERTIFICATION
        state: DEFERRED_POST_CUTOVER
      - id: ACTION_AUTH_MATRIX_AND_WHOLE_TUPLE_REVOCATION
        state: DEFERRED_POST_CUTOVER
      - id: MALICIOUS_SOURCE_AND_SUBSTITUTION_SECURITY_SUITE
        state: DEFERRED_POST_CUTOVER
      - id: SNAPSHOT_SECURITY_ATTESTATIONS
        state: DEFERRED_POST_CUTOVER
