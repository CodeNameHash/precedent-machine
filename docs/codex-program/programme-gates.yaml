        - production_cutover
        - P9_POSTCUTOVER_SMOKE
        - P9_TRACEABILITY
        - P9_PROGRAMME_COMPLETION_ATTESTATION
      terminal_pair_required: true
      terminal_pair_contract: PROPOSED_STATUS_PLUS_POST_COMPLETION_TRACE/V1

  ordinary_status_publication:
    status_schema: ProgrammeGateStatusArtefact/V2
    publication_head_schema: ProgrammeStatusPublicationHead/V1
    publication_head_authority: REPOSITORY_NATIVE_SINGLE_GIT_REF
    publication_head_git_ref: refs/heads/programme-status-publication-head
    publication_writer: PROTECTED_GITHUB_ACTION_ONLY
    compare_and_swap:
      expected_current_git_object_id: REQUIRED_EXCEPT_FOR_GENESIS
      stale_predecessor_effect: REJECT_WITH_ZERO_REF_CHANGE
      status_and_head_commit: ONE_ATOMIC_GIT_REF_UPDATE
      manual_status_edit_effect: INVALID
    first_v2_publication:
      generation: 1
      predecessor: NONE
      gate_projection: ALL_35_REGISTRY_GATES_EXACTLY_ONCE_IN_REGISTRY_ORDER
      unsupported_p1_and_p9_gate_state: OPEN
      canonical_work_start_must_be: PASS
      canonical_work_start_evaluation: RECOMPUTE_WITHIN_PROPOSED_STATUS_FROM_VALIDATED_G0_EVIDENCE_NOT_PREDECESSOR_STATUS
      consumes_gate_status_bootstrap_nonce: true

  terminal_completion_binding:
    proposed_status_gates:
      - P9_TRACEABILITY
      - P9_PROGRAMME_COMPLETION_ATTESTATION
    required_trace_phase: POST_COMPLETION
    required_trace_variant: PASS_PHASE
    forbidden_trace_variant: FAILURE_TERMINAL
    publication: DATABASE_TERMINAL_PAIR_THEN_PROTECTED_GIT_REF_CAS
    database_terminal_pair_authority: APPEND_ONLY_COMPLETION_TERMINAL_PAIR_ATTEMPTS
    attempt_unique_key: [status_generation, expected_git_predecessor_object_id, proposed_status_payload_digest]
    open_attempt_cardinality: AT_MOST_ONE_PER_EXPECTED_GIT_PREDECESSOR
    published_attempt_cardinality: AT_MOST_ONE_GLOBALLY
    git_head_remains_sole_programme_status_publication_head: true
    cross_system_atomic_commit_required: false
    retry_rule: SAME_PREDECESSOR_REVALIDATES_EXISTING_ATTEMPT;ADVANCED_PREDECESSOR_APPENDS_STALE_ABANDONMENT_AND_FULLY_RECOMPUTES_FRESH_NEXT_GENERATION_ATTEMPT
    partial_pair_effect: OPEN_UNTIL_GIT_HEAD_REFERENCES_THE_EXACT_DATABASE_PAIR
    later_untraced_status_effect: OPEN

